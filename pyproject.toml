[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yg-data"
version = "2.1.0"
description = "接触角数据处理与表面能计算（OWRK）软件"
requires-python = ">=3.9"
dependencies = [
    "PySide6==6.11.2",
    "pywin32==312; sys_platform == 'win32'",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "build", "dist", "ui/main_window_ui.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLC", "RET", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 负责
    "BLE001", # 需要捕获宽泛异常的地方已逐处注明原因
    "PLC0415",# 惰性导入是刻意设计
]
